name: Main

on:
  push:
    branches:
      - master
  pull_request:

defaults:
  run:
    shell: bash

env:
  LANG: C.UTF-8
  ASYNC_TEST_TIMEOUT: 60

jobs:
  test:
    runs-on: ubuntu-latest
    container: ghcr.io/apertium/apertium-apy-cicd
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install system dependencies
        run: apt-get update && apt-get install -y file python3-pip python3-venv
      - name: Create venv
        run: python3 -m venv venv
      - name: Install Pipenv
        run: source venv/bin/activate && python3 -m pip install pipenv
      - name: Install Pip dependencies
        run: source venv/bin/activate && pipenv install --deploy --dev

      - name: Build
        run: source venv/bin/activate && pipenv run make

      - name: Test
        run: source venv/bin/activate && NONPAIRS=/tmp/languages pipenv run make unit-test
  lint:
    runs-on: ubuntu-latest
    container: ghcr.io/apertium/apertium-apy-cicd
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install system dependencies
        run: apt-get update && apt-get install -y python3-pip python3-venv
      - name: Create venv
        run: python3 -m venv venv
      - name: Install Pipenv
        run: source venv/bin/activate && python -m pip install pipenv
      - name: Install Pip dependencies
        run: source venv/bin/activate && pipenv install --deploy --dev

      - name: Build
        run: source venv/bin/activate && pipenv run make

      - name: Lint
        run: source venv/bin/activate && pipenv run make lint
  coverage:
    runs-on: ubuntu-latest
    container: ghcr.io/apertium/apertium-apy-cicd
    steps:
      - name: Checkout
        uses: actions/checkout@v7
      - name: Install system dependencies
        run: apt-get update && apt-get install -y file python3-pip python3-venv
      - name: Create venv
        run: python3 -m venv venv
      - name: Install Pipenv
        run: source venv/bin/activate && python -m pip install pipenv
      - name: Install Pip dependencies
        run: source venv/bin/activate && pipenv install --deploy --dev

      - name: Build
        run: source venv/bin/activate && pipenv run make

      - name: Test
        run: source venv/bin/activate && NONPAIRS=/tmp/languages pipenv run make coverage

      - name: Coveralls
        run: source venv/bin/activate && pipenv run coveralls --service=github
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
